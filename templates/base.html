<!DOCTYPE html>
<html>

<head>
<link type="text/css" href="{{ url_for('static', filename='css/styles.css')}}" rel="stylesheet" />
{% block title -%}
{% if title %}
         <title>Flask - {{title}}</title>
{% else %}
         <title>Flask</title>
{% endif %}
{% endblock %}
</head>
<body>
{% block content -%}
         {%- block mainmenu -%}
<ul class="horizontal-list">
         {% for m in menu -%}
<li><a href="{{m.url}}">{{m.name}}</a></li>
         {% endfor -%}
</ul>
         {% endblock mainmenu -%}
{% endblock -%}
</body>
</html>
